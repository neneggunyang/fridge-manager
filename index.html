<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#eef1f3">
<title>냉장고 관리</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
  [hidden]{display:none!important}
  *{box-sizing:border-box}
  html{overflow-x:hidden}
  body{
    margin:0;
    min-width:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#eef1f3;
    color:#27313a;
  }
  button,input,select,textarea{font:inherit}
  button{cursor:pointer}

  .app{
    width:min(1180px,100%);
    margin:0 auto;
    padding:38px 28px 54px;
  }

  header{
    position:relative;
    text-align:center;
    margin:0 auto 28px;
    padding:0 120px;
  }
  h1{
    margin:0;
    font-size:clamp(27px,3.2vw,36px);
    line-height:1.25;
    font-weight:800;
    letter-spacing:-.04em;
  }
  .subtitle{
    margin:8px 0 0;
    color:#7a858d;
    font-size:14px;
    line-height:1.5;
  }
  .stats{
    position:absolute;
    right:0;
    bottom:2px;
    color:#65717a;
    font-size:13px;
    white-space:nowrap;
  }

  .fridge{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
    padding:12px;
    background:linear-gradient(145deg,#dfe4e7,#c2c9cd);
    border-radius:24px;
    box-shadow:0 18px 40px rgba(48,58,65,.15);
  }

  .door{
    position:relative;
    min-height:650px;
    padding:30px 28px 24px;
    background:linear-gradient(145deg,#fafbfb,#e8ecee);
    border-radius:16px;
    overflow:hidden;
  }
  .door:before{
    content:"";
    position:absolute;
    top:0;bottom:0;width:5px;
    background:rgba(130,140,146,.16);
    pointer-events:none;
  }
  .freezer:before{right:0}
  .fridge-door:before{left:0}

  .door-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 2px 22px;
  }
  .door-title h2{
    margin:0;
    font-size:21px;
    letter-spacing:-.03em;
  }
  .door-title span{
    font-size:11px;
    color:#849098;
    background:#f8fafb;
    padding:7px 11px;
    border-radius:20px;
  }

  .shelf{
    position:relative;
    min-height:132px;
    margin:0 0 16px;
    padding:15px 14px 21px;
    border-bottom:8px solid #c4ccd0;
    border-radius:6px;
    background:rgba(255,255,255,.38);
    cursor:pointer;
    transition:.15s;
  }
  .shelf:hover{background:rgba(255,255,255,.72)}
  .shelf:last-child{margin-bottom:0}
  .shelf-label{
    text-align:center;
    font-size:11px;
    color:#9aa4aa;
    margin-bottom:11px;
  }

  .items{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:9px;
    align-items:start;
    max-height:185px;
    overflow-y:auto;
    padding:2px 3px 4px;
    scrollbar-gutter:stable;
  }
  .items::-webkit-scrollbar{width:7px}
  .items::-webkit-scrollbar-thumb{background:#cbd3d7;border-radius:10px}

  .item{
    min-width:0;
    width:100%;
    padding:10px 8px 9px;
    background:#fff;
    border:1px solid #dce2e5;
    border-radius:11px;
    box-shadow:0 3px 8px rgba(50,60,65,.07);
    text-align:center;
  }
  .item-name{
    font-weight:700;
    font-size:12px;
    line-height:1.35;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .item-date,.item-age{
    margin-top:4px;
    font-size:9px;
    line-height:1.3;
    color:#849098;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .item-age{color:#607d8b}
  .item.completed{opacity:.55;background:#f2f4f5}
  .item.completed .item-name,
  .item.completed .item-date,
  .item.completed .item-age{text-decoration:line-through}

  .item-actions{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    gap:5px;
    margin-top:8px;
  }
  .use-check{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:4px;
    font-size:9px;
    line-height:1.2;
    color:#748087;
    cursor:pointer;
  }
  .use-check input{
    width:14px;height:14px;margin:0;
    accent-color:#667f89;
  }
  .delete-item{
    width:auto;
    height:24px;
    padding:0 7px;
    border:0;
    border-radius:6px;
    background:#edf0f1;
    color:#7c878d;
    font-size:9px;
    font-weight:600;
  }
  .delete-item:hover{background:#e2e6e8;color:#4e5b62}

  .top-actions{
    display:flex;
    justify-content:center;
    gap:9px;
    margin-top:18px;
  }
  .top-actions button{
    height:39px;
    border-radius:9px;
  }
  .save-button{background:#536c77}
  .png-button{background:#7b6b78}
  .save-status{
    text-align:center;
    margin-top:8px;
    min-height:17px;
    font-size:11px;
    color:#7a858d;
  }

  .controls,.meal-notes{
    margin-top:18px;
    padding:20px;
    background:#fff;
    border-radius:17px;
    box-shadow:0 5px 20px rgba(40,50,55,.07);
  }
  .controls h3,.meal-notes h3{
    margin:0 0 13px;
    text-align:center;
    font-size:16px;
  }
  .form{
    display:grid;
    grid-template-columns:1.2fr .85fr .75fr 1.2fr auto;
    gap:9px;
    align-items:center;
  }
  input,select{
    width:100%;
    height:42px;
    border:1px solid #d7dfe3;
    border-radius:9px;
    padding:0 11px;
    background:#fff;
    color:#27313a;
    min-width:0;
  }
  input:focus,select:focus,textarea:focus{
    outline:2px solid #b8d8e5;
    border-color:#a8cbd8;
  }
  .form button{
    height:42px;
    border:0;
    border-radius:9px;
    background:#536c77;
    color:#fff;
    padding:0 17px;
    font-weight:700;
    white-space:nowrap;
  }
  .form button:hover,.save-button:hover{background:#405a65}
  .png-button:hover{background:#665563}

  .notice{
    margin-top:10px;
    text-align:center;
    font-size:12px;
    line-height:1.6;
    color:#8a959b;
  }
  .meal-notes p{
    margin:0 0 10px;
    text-align:center;
    font-size:12px;
    color:#8a959b;
  }
  textarea{
    display:block;
    width:100%;
    min-height:110px;
    resize:vertical;
    border:1px solid #d7dfe3;
    border-radius:9px;
    padding:11px;
    background:#fff;
    color:#27313a;
    line-height:1.5;
  }

  @media(max-width:900px){
    .app{padding-left:18px;padding-right:18px}
    header{padding:0 90px}
    .items{grid-template-columns:repeat(3,minmax(0,1fr))}
    .form{grid-template-columns:1.3fr .9fr .8fr 1.1fr}
    .form button{grid-column:1/-1}
  }

  @media(max-width:680px){
    .app{padding:28px 12px 40px}
    header{
      padding:0;
      margin-bottom:22px;
    }
    h1{font-size:28px}
    .subtitle{font-size:13px}
    .stats{
      position:static;
      margin-top:9px;
      font-size:12px;
    }

    .fridge{
      grid-template-columns:1fr;
      gap:8px;
      padding:8px;
      border-radius:20px;
    }
    .door{
      min-height:auto;
      padding:22px 16px 20px;
      border-radius:14px;
    }
    .door-title{margin:0 2px 18px}
    .door-title h2{font-size:19px}
    .shelf{
      min-height:126px;
      margin-bottom:13px;
      padding:14px 10px 18px;
    }
    .items{
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:8px;
      max-height:205px;
      padding-right:2px;
    }
    .item{padding:9px 7px}
    .item-actions{gap:4px}
    .use-check{font-size:9px}
    .delete-item{height:23px}

    .top-actions{
      flex-wrap:wrap;
      margin-top:15px;
    }
    .top-actions button{
      flex:1 1 145px;
      max-width:210px;
    }

    .controls,.meal-notes{
      padding:17px 14px;
      border-radius:15px;
    }
    .form{grid-template-columns:1fr 1fr;gap:8px}
    .form button{grid-column:1/-1}
    .notice{font-size:11px}
  }

  @media(max-width:390px){
    h1{font-size:25px}
    .door{padding-left:12px;padding-right:12px}
    .items{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
    .item-name{font-size:11px}
    .form{grid-template-columns:1fr}
    .form button{grid-column:auto}
    .top-actions button{max-width:none}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>냉장고에 뭐가 들었나요?</h1>
      <p class="subtitle">내 냉장고 속 재료를 한눈에 기록해요.</p>
    </div>
    <div class="stats" id="stats">냉동 0개 · 냉장 0개</div>
  </header>

  <main class="fridge">
    <section class="door freezer">
      <div class="door-title">
        <h2>❄️ 냉동실</h2><span>LEFT</span>
      </div>
      <div class="shelf" data-location="냉동실 · 상단">
        <div class="shelf-label">상단</div><div class="items"></div>
      </div>
      <div class="shelf" data-location="냉동실 · 중단">
        <div class="shelf-label">중단</div><div class="items"></div>
      </div>
      <div class="shelf" data-location="냉동실 · 하단">
        <div class="shelf-label">하단</div><div class="items"></div>
      </div>
    </section>

    <section class="door fridge-door">
      <div class="door-title">
        <h2>🥬 냉장실</h2><span>RIGHT</span>
      </div>
      <div class="shelf" data-location="냉장실 · 상단">
        <div class="shelf-label">상단</div><div class="items"></div>
      </div>
      <div class="shelf" data-location="냉장실 · 중단">
        <div class="shelf-label">중단</div><div class="items"></div>
      </div>
      <div class="shelf" data-location="냉장실 · 하단">
        <div class="shelf-label">하단</div><div class="items"></div>
      </div>
    </section>
  </main>

  <div class="top-actions">
    <button type="button" class="save-button" id="saveButton">💾 저장</button>
    <button type="button" class="png-button" id="pngButton">🖼️ PNG로 저장</button>
  </div>
  <div class="save-status" id="saveStatus"></div>

  <section class="controls">
    <h3>식재료 추가</h3>
    <form class="form" id="form">
      <input id="name" placeholder="식재료 이름" required>
      <input id="date" type="date" aria-label="냉장고에 넣은 날">
      <input id="qty" placeholder="수량" value="1">
      <select id="location">
        <option>냉장실 · 상단</option>
        <option>냉장실 · 중단</option>
        <option>냉장실 · 하단</option>
        <option>냉동실 · 상단</option>
        <option>냉동실 · 중단</option>
        <option>냉동실 · 하단</option>
      </select>
      <button type="submit">추가하기</button>
    </form>
    <div class="notice">재료가 많아지면 각 선반 안에서 스크롤할 수 있어요. 이 앱은 로그인 없이 이 브라우저에만 저장됩니다. 넣은 날을 몰라도 비워둔 채 등록할 수 있고, 사용할 계획을 체크하면 취소선으로 표시됩니다.</div>
  </section>

  <section class="meal-notes">
    <h3>🍳 요리·식단 메모</h3>
    <p>냉장고 속 재료로 해먹을 요리나 앞으로의 식단을 자유롭게 적어보세요.</p>
    <textarea id="mealNotes" placeholder="예) 계란 + 대파 → 계란볶음밥&#10;이번 주에는 냉동 삼겹살부터 먹기"></textarea>
  </section>
</div>

<script>
let items = [];

const $ = id => document.getElementById(id);
const cacheKey = () => "myFridgeItems";
const notesKey = () => "myFridgeMealNotes";

function daysSince(dateString){
  const start = new Date(dateString + "T00:00:00");
  const today = new Date();
  const now = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  return Math.max(0, Math.floor((now - start) / 86400000));
}

function localBackup(){
  localStorage.setItem(cacheKey(), JSON.stringify(items));
  localStorage.setItem(notesKey(), $("mealNotes").value);
}

function setStatus(message){
  $("saveStatus").textContent = message;
}

function loadLocalData(){
  try{
    items = JSON.parse(localStorage.getItem(cacheKey()) || "[]");
    $("mealNotes").value = localStorage.getItem(notesKey()) || "";
  }catch{
    items = [];
    $("mealNotes").value = "";
  }
  render();
}

function saveLocal(){
  localBackup();
  setStatus("✓ 이 브라우저에 저장했어요.");
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function render(){
  document.querySelectorAll(".shelf .items").forEach(el=>el.innerHTML="");

  items.forEach(item=>{
    if(!item.id) item.id = crypto.randomUUID();
    if(typeof item.completed !== "boolean") item.completed = false;

    const shelf = [...document.querySelectorAll(".shelf")]
      .find(s=>s.dataset.location===item.location);
    if(!shelf) return;

    const card = document.createElement("div");
    card.className = "item" + (item.completed ? " completed" : "");

    const dateInfo = item.date
      ? `${item.date.replaceAll("-",".")} 넣음`
      : "넣은 날 미기록";
    const ageInfo = item.date
      ? `넣은 지 ${daysSince(item.date)}일 · ${escapeHtml(item.qty)}`
      : `넣은 날 없음 · ${escapeHtml(item.qty)}`;

    card.innerHTML = `
      <div class="item-name">${escapeHtml(item.name)}</div>
      <div class="item-date">${dateInfo}</div>
      <div class="item-age">${ageInfo}</div>
      <div class="item-actions">
        <label class="use-check">
          <input type="checkbox" class="complete-check" ${item.completed ? "checked" : ""}>
          사용할 계획
        </label>
        <button type="button" class="delete-item">삭제</button>
      </div>
    `;

    card.querySelector(".complete-check").addEventListener("change",e=>{
      item.completed = e.target.checked;
      localBackup();
      render();
    });

    card.querySelector(".delete-item").addEventListener("click",e=>{
      e.stopPropagation();
      const index = items.indexOf(item);
      if(index !== -1) items.splice(index,1);
      localBackup();
      render();
    });

    shelf.querySelector(".items").appendChild(card);
  });

  const freezer = items.filter(x=>x.location && x.location.startsWith("냉동")).length;
  const fridge = items.length - freezer;
  $("stats").textContent = `냉동 ${freezer}개 · 냉장 ${fridge}개`;
}

$("saveButton").addEventListener("click",saveLocal);

$("mealNotes").addEventListener("input",localBackup);

$("pngButton").addEventListener("click",async()=>{
  const button = $("pngButton");
  const original = button.textContent;
  button.textContent = "이미지 만드는 중…";
  button.disabled = true;
  try{
    const target = document.querySelector(".fridge");
    const canvas = await html2canvas(target,{
      backgroundColor:"#eef1f3",
      scale:2,
      useCORS:true
    });
    const link = document.createElement("a");
    const today = new Date().toISOString().slice(0,10);
    link.download = `내-냉장고-${today}.png`;
    link.href = canvas.toDataURL("image/png");
    link.click();
    setStatus("✓ 냉장고 상태를 PNG 이미지로 저장했어요.");
  }catch{
    setStatus("이미지 저장에 실패했어요. 브라우저에서 다시 시도해주세요.");
  }finally{
    button.textContent = original;
    button.disabled = false;
  }
});

$("form").addEventListener("submit",e=>{
  e.preventDefault();

  items.push({
    id:crypto.randomUUID(),
    name:$("name").value.trim(),
    date:$("date").value,
    qty:$("qty").value.trim() || "1",
    location:$("location").value,
    completed:false
  });

  localBackup();
  e.target.reset();
  $("date").value = new Date().toISOString().slice(0,10);
  $("qty").value = "1";
  render();
  setStatus("✓ 식재료를 추가했어요.");
});

document.querySelectorAll(".shelf").forEach(shelf=>{
  shelf.addEventListener("click",e=>{
    if(e.target.closest(".item")) return;
    $("location").value = shelf.dataset.location;
    $("name").focus();
  });
});

$("date").value = new Date().toISOString().slice(0,10);
loadLocalData();
</script>
</body>
</html>
